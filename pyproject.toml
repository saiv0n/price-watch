[project]
name = "price-watch"
version = "0.1.0"
description = "Config-driven product scraper and price tracker with drop alerts"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
js = ["playwright>=1.45"]

[project.scripts]
price-watch = "price_watch.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "respx>=0.21"]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"
