name: scheduled crawl
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: crawl
        env:
          PRICE_WATCH_WEBHOOK: ${{ secrets.PRICE_WATCH_WEBHOOK }}
        run: uv run price-watch --db data/books.db run examples/books.yaml -o data/books.csv
      - name: commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "crawl $(date -u +%F)"
          git push
